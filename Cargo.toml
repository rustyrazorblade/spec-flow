[package]
name = "spec-flow"
version = "0.1.0"
edition = "2024"
description = """
spec-flow — a standalone, project-agnostic MCP daemon that owns the work \
queue and git/GitHub mechanics for AI-agent software delivery. See \
/agent-fleet-manager-spec.md for the full specification.
"""
license = "Apache-2.0"
repository = "https://github.com/rustyrazorblade/skills"
publish = false

# `cargo doc` renders the crate doc comment in `src/lib.rs`; keep this in
# sync with the design note there rather than duplicating it here.

[[bin]]
name = "spec-flow"
path = "src/main.rs"

[lib]
name = "spec_flow"
path = "src/lib.rs"

[dependencies]
# Config + committed workflow files (§11) are YAML; issue/PR payloads read
# back from `gh --json ...` / `gh api graphql` (§8.4, §8.5) are JSON.
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Config durations (`heartbeat_ttl: 1h`, `phase_timeout: 45m`, §11.1) are
# human-readable strings; this gives them real `std::time::Duration` types
# on both (de)serialize directions instead of hand-rolled string parsing.
humantime-serde = "1"

# `spec-flow` the binary: `serve` / `init` subcommands (§14.1).
clap = { version = "4", features = ["derive"] }

# Error-handling split (rust-style-guide.md §10): hand-written error enums
# in the library (via thiserror, still no anyhow dependency from the lib
# crate's public API), anyhow only at the binary's top level (main.rs).
thiserror = "2"
anyhow = "1"

# Observability (rust-style-guide.md §13): tracing, never print!.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The MCP server (§2.5, §5, §6, §14): the official Rust SDK
# (https://github.com/modelcontextprotocol/rust-sdk). The `server` feature
# (on by default) brings the `#[tool]`/`#[tool_router]`/`#[tool_handler]`
# macro family plus the `ServerHandler` trait, and pulls in `schemars`,
# which `rmcp` re-exports as `rmcp::schemars` — so tool argument/result
# types derive `JsonSchema` without this crate pinning schemars itself and
# risking a version split against the one the macros generate code for.
# `transport-streamable-http-server` is §2.5/§14's "MCP over HTTP/SSE,
# loopback only" surface; deliberately NOT `transport-io` (stdio), which
# §14 rules out ("not stdio — many phase processes connect").
rmcp = { version = "3.1", features = [
  "server",
  "transport-streamable-http-server",
] }

# `rmcp`'s streamable-HTTP server transport is a `tower::Service`, not a
# listener — something must bind the socket and route to it. `axum` is what
# `rmcp`'s own tests/examples use for exactly this, and with default
# features off it is a thin layer over `hyper` (none of the ws/multipart/
# macro machinery this crate would never call).
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }

# The async runtime `rmcp` requires. Deliberately narrow feature set:
# `rt-multi-thread` + `macros` for `#[tokio::main]`, `net` for the TCP
# listener, `signal` for `serve`'s Ctrl-C graceful shutdown. `process` is
# absent on purpose — `crate::vcs` keeps shelling out synchronously via
# `std::process`, and `crate::server` runs those blocking calls on
# `tokio::task::spawn_blocking` (part of `rt`) rather than rewriting the
# git/gh layer async.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
] }

[dev-dependencies]
# `spec-flow init` writes real files (a project config, `.spec-flow/`
# scaffolding); its tests run against a scratch directory rather than
# the operator's home or a real checkout.
tempfile = "3"

# `tests/mcp_server.rs` stands the real server up on an ephemeral loopback
# port and drives it with a real MCP client over HTTP, so the handshake /
# session / tool-dispatch path is covered end to end instead of asserted
# about. Client side only — never a runtime dependency.
rmcp = { version = "3.1", features = [
  "client",
  "transport-streamable-http-client-reqwest",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
